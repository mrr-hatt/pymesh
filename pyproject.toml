[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymesh"
version = "0.2.0"
description = "Encrypted private mesh network powered by WireGuard and Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "PyMesh Developers"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyroute2>=0.7.0; sys_platform == 'linux'",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
pymesh = "pymesh.cli.main:app"

[tool.setuptools]
packages = ["pymesh"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
